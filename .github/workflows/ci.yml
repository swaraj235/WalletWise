name: CI — Lint & Type Check

on:
  push:
    branches: ["**"]       # Run on every branch push
  pull_request:
    branches: [main]       # Required to pass before merging to main

jobs:
  lint-and-typecheck:
    name: Lint + TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Lint
        run: npx expo lint
        env:
          EXPO_PUBLIC_GROQ_API_KEY: placeholder
          EXPO_PUBLIC_MAPBOX_TOKEN: placeholder

      - name: TypeScript type check
        run: npx tsc --noEmit
