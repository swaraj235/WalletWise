version: "3.9"

services:
  # ── Track 1: Expo dev server ──────────────────────────────────────
  app:
    build: .
    ports:
      - "8081:8081"        # Metro bundler
    volumes:
      - .:/app             # Live source mounting
      - /app/node_modules  # Prevent host node_modules from overriding
    env_file:
      - .env               # Loads API keys
    command: npx expo start --tunnel

  # ── Track 2: DS inference service stub ────────────────────────────
